<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings | Lowchan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="top-strip">
        <div class="strip-inner">
            <span><b>Lowchan</b> // Settings</span>
            <div class="top-links"><a href="/">Return Home</a></div>
        </div>
    </nav>

    <div class="main-wrapper">
        <header class="site-header">
            <h1 class="logo">SETTINGS</h1>
        </header>

        <div class="about-box" style="margin: 0 auto;">
            <h3>// SESSION PREFERENCES</h3>
            <p>Your ID: <span id="user-id">LOADING...</span></p>
            <br>
            <label style="display: block; margin-bottom: 10px;">
                <input type="checkbox" checked> Enable "Student Blue" Theme
            </label>
            <label style="display: block; margin-bottom: 10px;">
                <input type="checkbox" checked> Show Sponsored Content
            </label>
            <label style="display: block; margin-bottom: 10px;">
                <input type="checkbox"> <b>Legacy Mode (Beige)</b>
            </label>
            <br>
            <button style="padding: 10px;">Save Configuration</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
