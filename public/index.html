<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lowchan | Anonymous</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="loading-screen" class="overlay">
        <div class="spinner"></div>
        <p>Initializing Anonymity...</p>
    </div>

    <nav class="glass-nav">
        <h1 onclick="navigate('/')">LOWCHAN</h1>
        <div class="nav-links">
            <button onclick="navigate('/donate')">♥ Donate</button>
            <button onclick="openSettings()">⚙ Settings</button>
        </div>
    </nav>

    <main id="view-container">
        </main>

    <div id="tutorial" class="hidden overlay">
        <div class="modal">
            <h2>Welcome to Lowchan</h2>
            <p id="tut-text">This is an anonymous imageboard. No accounts needed.</p>
            <button onclick="nextTutStep()">Next</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
