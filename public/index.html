<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lowchan | Internal Node</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div id="loader"><h1>LOWCHAN</h1></div>

    <nav class="navbar">
        <div class="nav-content">
            <div class="user-info" onclick="nav('profile')">
                <img id="my-pfp" src="https://api.dicebear.com/7.x/identicon/svg?seed=default" class="pfp-small">
                <span id="id-tag"></span>
            </div>
            <div class="menu">
                <button onclick="nav('home')">Feed</button>
                <button onclick="nav('rules')">Legal</button>
            </div>
        </div>
    </nav>

    <div class="app-container">
        <div id="view-profile" class="page" style="display:none;">
            <div class="panel">
                <h2>USER_PROFILE</h2>
                <div class="profile-edit">
                    <p>Profile Picture (URL):</p>
                    <input type="text" id="pfp-url" placeholder="Paste image link...">
                    <p>Social Link:</p>
                    <input type="text" id="social-link" placeholder="Discord / X / Insta">
                    <button class="btn" onclick="saveProfile()">SAVE_CHANGES</button>
                </div>
            </div>
        </div>

        <div id="view-board" class="page" style="display:none;">
            <div class="board-header">
                <h2 id="board-title">/board/</h2>
                <button class="exit-btn" onclick="nav('home')">EXIT</button>
            </div>
            <div class="panel">
                <textarea id="board-msg" placeholder="Broadcast to this board..."></textarea>
                <button class="btn" onclick="send('board')">TRANSMIT</button>
            </div>
            <div id="board-feed"></div>
        </div>

        <div id="view-home" class="page">
            <div class="panel">
                <textarea id="msg" placeholder="Global transmission..."></textarea>
                <button class="btn" onclick="send('home')">POST_GLOBAL</button>
            </div>
            <div id="feed"></div>
            <div class="board-grid">
                <button onclick="nav('math')">/math/</button>
                <button onclick="nav('sci')">/sci/</button>
                <button onclick="nav('cs')">/cs/</button>
                <button onclick="nav('media')" class="media-btn">/media/</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
