<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lowchan | Internal Node</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="loader" style="position:fixed; inset:0; background:#000; z-index:10000; display:flex; align-items:center; justify-content:center; flex-direction:column; transition: opacity 0.5s;">
        <h1 style="color:#7c3aed; font-family:monospace; margin:0;">LOWCHAN</h1>
        <p style="color:#333; font-family:monospace; font-size:10px;">ESTABLISHING_CONNECTION...</p>
    </div>

    <script>
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }
        }, 3000); // 3-second emergency limit
    </script>

    <div id="announcement-bar" class="notice-strip">
        <span id="notice-text">Welcome to the Network. Be anonymous. Be safe.</span>
        <button id="edit-notice" style="display:none;" onclick="changeNotice()">[EDIT]</button>
    </div>

    <nav class="navbar">
        <div class="nav-content">
            <div class="user-block" onclick="nav('profile')">
                <img id="my-pfp" src="https://api.dicebear.com/7.x/identicon/svg?seed=user" class="pfp-nav">
                <span id="id-tag">ID-00000</span>
            </div>
            <div class="nav-links">
                <button onclick="nav('home')">Global</button>
                <button onclick="nav('rules')">Legal</button>
            </div>
        </div>
    </nav>

    <div class="app-container">
        <div class="ad-container">
            <script type="text/javascript">
                atOptions = { 'key' : 'b1637057c1ef17630b41564da4135bf9', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
            </script>
            <script type="text/javascript" src="https://www.highperformanceformat.com/b1637057c1ef17630b41564da4135bf9/invoke.js"></script>
        </div>

        <div id="view-home" class="page">
            <div class="composer">
                <textarea id="msg" placeholder="Broadcast to global feed..."></textarea>
                <button class="btn-main" onclick="send('home')">EXECUTE_POST</button>
            </div>
            <div id="feed"></div>
            
            <div class="directory">
                <h3>DIRECTORY</h3>
                <div class="board-grid">
                    <button onclick="nav('math')">/math/</button>
                    <button onclick="nav('sci')">/sci/</button>
                    <button onclick="nav('cs')">/cs/</button>
                    <button onclick="nav('tech')">/tech/</button>
                    <button onclick="nav('media')" class="highlight">/media/</button>
                    <button onclick="nav('news')">/news/</button>
                    <button onclick="nav('v')">/v/</button>
                    <button onclick="nav('a')">/a/</button>
                </div>
            </div>
        </div>

        </div>

    <script src="app.js"></script>
</body>
</html>
