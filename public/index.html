<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lowchan | Index</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="chan-theme">
    <header class="board-list">
        [<a href="#" onclick="nav('home')">home</a> / 
        <a href="#" onclick="nav('v')">v</a> / 
        <a href="#" onclick="nav('a')">a</a> / 
        <a href="#" onclick="nav('sci')">sci</a> / 
        <a href="#" onclick="nav('tech')">tech</a> / 
        <a href="#" onclick="nav('fit')">fit</a>] 
        <span class="admin-link" onclick="openAdminPanel()">[Admin]</span>
    </header>

    <div id="app-content">
        <div id="view-home" class="page">
            <h1 class="site-title">LOWCHAN</h1>
            <div class="stats-box">
                Total Posts: <span id="total-posts">0</span> | Active Users: <span id="active-users">1</span>
            </div>
            <div class="board-directory">
                <h3>Boards</h3>
                <ul>
                    <li><a href="#" onclick="nav('v')">/v/ - Video Games</a></li>
                    <li><a href="#" onclick="nav('a')">/a/ - Anime & Manga</a></li>
                    <li><a href="#" onclick="nav('tech')">/tech/ - Technology</a></li>
                </ul>
            </div>
        </div>

        <div id="view-board" class="page" style="display:none;">
            <h2 id="board-header">/board/</h2>
            <div class="post-form-container">
                <button onclick="toggleForm()" id="form-toggle">Start a New Thread</button>
                <div id="post-form" class="hidden">
                    <input type="text" id="post-pfp" placeholder="Image URL (Required)">
                    <textarea id="post-text" placeholder="Comment"></textarea>
                    <button onclick="submitThread()">Post</button>
                </div>
            </div>
            <hr>
            <div id="thread-container" class="catalog-grid"></div>
        </div>
    </div>

    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <h3>Staff Authentication</h3>
            <input type="password" id="admin-pass" placeholder="Enter Credentials">
            <button onclick="tryAdmin()">Login</button>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>

    <div id="mod-popup" class="modal">
        <div class="modal-content">
            <h3>Ban User</h3>
            <p>User ID: <span id="target-uid"></span></p>
            <input type="text" id="ban-reason" placeholder="Reason">
            <select id="ban-duration">
                <option value="1">24 Hours</option>
                <option value="7">7 Days</option>
                <option value="0">Permanent</option>
            </select>
            <button onclick="executeBan()">Confirm Ban</button>
            <button onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
