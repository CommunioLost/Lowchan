<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LOWCHAN NODE</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="chan-theme">
    <div class="main-wrapper">
        <div id="view-home" class="page centered">
            <h1 class="retro-title">LOWCHAN</h1>
            <div class="terminal-border">
                <p>TOTAL_POSTS: <span id="post-count">0</span></p>
                <p>NODE_STATUS: <span style="color:green">ONLINE</span></p>
            </div>
            
            <div class="ad-slot-center">
                </div>

            <div class="login-box terminal-border">
                <h3>STAFF_LOGIN</h3>
                <input type="password" id="admin-pass" placeholder="PASSKEY">
                <button onclick="handleLogin()">ACCESS</button>
            </div>
        </div>

        <div id="view-board" class="page" style="display:none;">
            <div class="header-area centered">
                <h2 id="board-title" class="retro-title">/v/</h2>
                <div class="post-box terminal-border">
                    <input type="text" id="img-input" placeholder="Image URL">
                    <textarea id="text-input" placeholder="Comment..."></textarea>
                    <button id="post-btn">SUBMIT_POST</button>
                </div>
            </div>
            <hr class="divider">
            <div id="catalog-container" class="grid-layout"></div>
        </div>

        <footer class="bottom-nav">
            [ <a href="#" onclick="nav('home')">home</a> / 
              <a href="#" onclick="nav('v')">v</a> / 
              <a href="#" onclick="nav('a')">a</a> / 
              <a href="#" onclick="nav('sci')">sci</a> / 
              <a href="#" onclick="nav('tech')">tech</a> / 
              <a href="#" onclick="nav('fit')">fit</a> ]
        </footer>
    </div>

    <div id="mod-overlay" class="overlay" style="display:none;">
        <div class="modal terminal-border">
            <h3>MODERATION_PANEL</h3>
            <input type="text" id="ban-reason" placeholder="Reason">
            <select id="ban-time">
                <option value="24">24 Hours</option>
                <option value="0">PERMANENT</option>
            </select>
            <button id="confirm-ban-btn">EXECUTE</button>
            <button onclick="closeMod()">CANCEL</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
