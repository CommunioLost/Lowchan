<!DOCTYPE html>
<html lang="en" data-theme="blue">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lowchan | Global Network</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loader">
        <div class="loader-box">
            <h1 class="logo">LOWCHAN</h1>
            <div class="bar"><div class="fill"></div></div>
            <p>SYNCING_WITH_NODE...</p>
        </div>
    </div>

    <nav class="navbar">
        <div class="nav-content">
            <span class="brand" onclick="nav('home')">LOWCHAN <small id="id-tag"></small></span>
            <div class="menu">
                <button onclick="nav('settings')">Settings</button>
                <button onclick="nav('rules')">Rules</button>
            </div>
        </div>
    </nav>

    <div class="app-container">
        <div id="view-home" class="page">
            <div class="hero-card">
                <h2>:: GLOBAL_ACTIVITY</h2>
                <p>Real-time encrypted transmission. Anonymous by default.</p>
            </div>

            <div class="ad-box">
                <script type="text/javascript">
                    atOptions = { 'key' : 'b1637057c1ef17630b41564da4135bf9', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };
                </script>
                <script type="text/javascript" src="https://www.highperformanceformat.com/b1637057c1ef17630b41564da4135bf9/invoke.js"></script>
            </div>

            <div class="post-input-card">
                <textarea id="msg" placeholder="Write a message to the network..."></textarea>
                <button onclick="send()" class="submit-btn">EXECUTE_POST</button>
            </div>

            <div id="feed"></div>

            <hr class="divider">
            
            <div class="board-grid">
                <div class="grid-item">
                    <h3>CORE_BOARDS</h3>
                    <a onclick="nav('math')">/math/</a> <a onclick="nav('sci')">/sci/</a> <a onclick="nav('cs')">/cs/</a>
                </div>
                <div class="grid-item">
                    <h3>INTEREST_BOARDS</h3>
                    <a onclick="nav('v')">/v/</a> <a onclick="nav('a')">/a/</a> <a onclick="nav('mu')">/mu/</a>
                </div>
            </div>
        </div>

        <div id="view-board" class="page" style="display:none;">
            <div class="board-top">
                <h2 id="board-title">/board/</h2>
                <button onclick="nav('home')" class="exit-btn">← EXIT</button>
            </div>
            <div class="post-input-card">
                <textarea id="boardMsg" placeholder="Post to this directory..."></textarea>
                <button onclick="sendBoardPost()" class="submit-btn">SUBMIT_TO_BOARD</button>
            </div>
            <div id="boardFeed"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
